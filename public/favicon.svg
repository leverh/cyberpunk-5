<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- background -->
  <rect width="32" height="32" rx="4" fill="#0a0a0c"/>

  <!-- E letterform — outlined in yellow -->
  <text
    x="16"
    y="22"
    text-anchor="middle"
    font-family="Orbitron, 'Share Tech Mono', monospace"
    font-size="16"
    font-weight="900"
    fill="none"
    stroke="#fcee0a"
    stroke-width="1"
  >E</text>

  <!-- left bracket -->
  <line x1="5" y1="8"  x2="5"  y2="24" stroke="#fcee0a" stroke-width="1.5" stroke-linecap="square"/>
  <line x1="5" y1="8"  x2="10" y2="8"  stroke="#fcee0a" stroke-width="1.5" stroke-linecap="square"/>
  <line x1="5" y1="24" x2="10" y2="24" stroke="#fcee0a" stroke-width="1.5" stroke-linecap="square"/>

  <!-- right bracket -->
  <line x1="27" y1="8"  x2="27" y2="24" stroke="#fcee0a" stroke-width="1.5" stroke-linecap="square"/>
  <line x1="27" y1="8"  x2="22" y2="8"  stroke="#fcee0a" stroke-width="1.5" stroke-linecap="square"/>
  <line x1="27" y1="24" x2="22" y2="24" stroke="#fcee0a" stroke-width="1.5" stroke-linecap="square"/>
</svg>
